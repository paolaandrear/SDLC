environments {
  chrome {
    webdriver {
      driver = chrome
      autodownload = true
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["start-maximized", "test-type", "ignore-certificate-errors", "incognito", "disable-infobars", 
          "disable-gpu", "disable-default-apps", "disable-popup-blocking"]
        }
      }
    }
  }
  edge {
    webdriver {
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          args = ["start-maximized", "test-type", "ignore-certificate-errors", "incognito", "disable-infobars", "disable-gpu", 
          "disable-default-apps", "disable-popup-blocking"]
        }
      }
    }
  }

}

serenity {
take.screenshots = FOR_EACH_ACTION
}

